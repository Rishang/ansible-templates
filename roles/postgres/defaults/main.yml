---
# Preferred input: the unchanged schema YAML. It is read by the role's Python
# filter so custom_sql Jinja remains untouched until SQLConfig renders it.
postgres_config_file: null

# Optional inline alternative. Values containing SQL Jinja (for example
# {{ table }} or {% include %}) must use Ansible's !unsafe tag.
postgres_config: null

# Extra values exposed as environment variables while Pydantic resolves ${VAR}
# and custom_sql renders {{ env.VAR }}. This is useful for Ansible Vault values.
postgres_environment: {}
