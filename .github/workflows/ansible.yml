name: Validate Ansible role

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install UV
        run: |
          UV_INSTALL_DIR="$HOME/.local/bin" curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test the standalone schema gateway and role syntax
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml -p collections --force
          ANSIBLE_ROLES_PATH="$PWD/roles" \
          ANSIBLE_COLLECTIONS_PATH="$PWD/collections" \
            uv run ansible-playbook -i localhost, examples/playbook.yml --syntax-check
          bash test/run.sh
